# PPT/Office -> PDF 轉檔服務(FastAPI + 自帶字型 + 自動修跑版)
# 用法:
#   docker compose up -d --build
#   轉檔(與 gotenberg 相容的 -F files=@ 介面):
#     curl -X POST -F files=@來源.pptx http://localhost:3001/forms/libreoffice/convert -o 輸出.pdf
#   健康檢查 / API 文件:
#     curl http://localhost:3001/health
#     http://localhost:3001/docs
#   關閉:
#     docker compose down
services:
  ppt2pdf:
    build: .
    image: ppt2pdf-libreoffice:local
    container_name: ppt2pdf
    ports:
      - "3001:3000"          # 對外 3001 -> 容器內服務 3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
